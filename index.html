<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocword</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="coin-balance">
            <svg id="coin-icon" class="coin-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <radialGradient id="coin-gradient" cx="35%" cy="30%" r="80%">
                        <stop offset="0%" stop-color="#ffef9f"/>
                        <stop offset="55%" stop-color="#f7c948"/>
                        <stop offset="100%" stop-color="#c9921a"/>
                    </radialGradient>
                </defs>
                <circle cx="12" cy="12" r="10.5" fill="url(#coin-gradient)" stroke="#a97a12" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="7" fill="none" stroke="#fff3c4" stroke-width="1.2" opacity="0.8"/>
                <path d="M12 6.8l1.1 2.9 3.1.2-2.4 1.9.8 3-2.6-1.7-2.6 1.7.8-3-2.4-1.9 3.1-.2z" fill="#a97a12" opacity="0.9"/>
                <circle cx="8.2" cy="7.6" r="1.2" fill="#fff6cf" opacity="0.85"/>
            </svg>
            <span id="coin-balance-text">500</span>
        </div>
        <div class="header-buttons">
            <button id="btn-hint">Подсказка (25)</button>
            <button id="btn-levels">Уровни</button>
        </div>
    </header>
    
    <main>
        <div id="grid-container"></div>
        <div id="word-preview" class="word-preview" aria-live="polite"></div>
        <div id="wheel-container">
            <svg id="wheel-lines" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></svg>
            <button id="btn-shuffle" type="button" aria-label="Перемешать буквы" title="Перемешать буквы">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="16 3 21 3 21 8"></polyline>
                    <line x1="4" y1="20" x2="21" y2="3"></line>
                    <polyline points="21 16 21 21 16 21"></polyline>
                    <line x1="15" y1="15" x2="21" y2="21"></line>
                    <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
            </button>
        </div>
    </main>

    <!-- Меню уровней -->
    <div id="level-menu" class="modal hidden" aria-hidden="true">
        <div class="modal-panel">
            <div class="modal-header">
                <h2 id="level-menu-title">Эпизод 1 · Джунгли</h2>
                <button id="btn-close-levels" class="modal-close" aria-label="Закрыть">✕</button>
            </div>
            <div id="bank-row" class="bank-row bank-empty">
                <span class="bank-pig" aria-hidden="true">🐷</span>
                <span class="bank-text">
                    Копилка
                    <b id="bank-amount">0</b>
                </span>
                <button id="btn-claim-bank" class="bank-claim" type="button" disabled>Забрать</button>
            </div>
            <div id="level-grid" class="level-grid"></div>
        </div>
    </div>

    <!-- Завершение уровня -->
    <div id="level-complete" class="level-complete hidden" role="dialog" aria-modal="true"
         aria-labelledby="lc-title" aria-hidden="true">
        <div id="lc-confetti" class="lc-confetti" aria-hidden="true"></div>
        <div class="lc-panel">
            <div id="lc-croc" class="lc-croc" aria-hidden="true"></div>
            <h2 id="lc-title" class="lc-title">Уровень пройден!</h2>
            <p id="lc-subtitle" class="lc-subtitle">Эпизод 1 · Джунгли</p>
            <div class="lc-reward">
                <svg class="lc-coin" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10.5" fill="#f7c948" stroke="#a97a12" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="7" fill="none" stroke="#fff3c4" stroke-width="1.2" opacity="0.85"/>
                    <path d="M12 6.8l1.1 2.9 3.1.2-2.4 1.9.8 3-2.6-1.7-2.6 1.7.8-3-2.4-1.9 3.1-.2z" fill="#a97a12" opacity="0.9"/>
                </svg>
                <span class="lc-reward-amount">+<span id="lc-reward">0</span></span>
                <span id="lc-reward-unit">монет</span>
            </div>
            <div class="lc-actions">
                <button id="btn-next-level" class="lc-btn lc-btn-primary" type="button">Продолжить</button>
                <button id="btn-to-menu" class="lc-btn" type="button">В меню</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
